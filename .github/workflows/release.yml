name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build ShaBuilder.zip
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zip tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Build zip (ShaBuilder/ folder only)
        run: zip -r ShaBuilder.zip ShaBuilder

      - name: Verify archive structure
        run: unzip -l ShaBuilder.zip

      - name: Upload ShaBuilder.zip to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ShaBuilder.zip
